quarkus:
  http:
    port: 7979
#  log:
#    level: DEBUG
#    min-level: DEBUG
"%dev":
  quarkus:
    http:
      port: 7979
#    log:
#      level: TRACE
#      min-level: TRACE
    exporter:
      modules:
        - name: map_entries_mapper
          metrics:
            - name: health_status
              help: Health Status
              path: $.checks[?(@.name=="Database connections health check")].data
              type: object
              labels:
                datasource: service1
              key_label: datasource
              mapper:
                type: STRING_AS_VALUE
                mappings:
                  - key: UP
                    value: 1
                  - key: DOWN
                    value: 0
"%test":
  quarkus:
    http:
      test-port: -1
  exporter:
    modules:
      - name: default
        metrics:
          - name: simple_value
            help: simple value
            path: $.value
      - name: nested_structured_as_several_metrics_using_value
        metrics:
          - name: nested_structured
            help: nested structured
            path: $.data.service1
            labels:
              service: service1
          - name: nested_structured
            help: nested structured
            path: $.data.service2
            type: value
            labels:
              service: service2
      - name: nested_structured_as_several_metrics_using_object
        metrics:
          - name: nested_structured
            help: nested structured
            path: $.data
            type: object
            labels:
              service: service1
            values:
              service: $.service1
          - name: nested_structured
            help: nested structured
            path: $.data
            type: object
            labels:
              service: service2
            values:
              service: $.service2
      - name: nested_structured_using_object_with_additional_label
        metrics:
          - name: nested_structured
            help: nested structured
            path: $.data
            type: object
            labels:
              stage: $.stage
            values:
              service: $.service1
      - name: health
        metrics:
          - name: health
            help: Health Status
            path: $[?(@.status=="UP")]
            labels:
              x: y
      - name: string_value_mapper
        metrics:
          - name: health_status
            help: Health Status
            path: $.value1
            mapper:
              type: STRING_AS_VALUE
              mappings:
                - key: UP
                  value: 1
                - key: DOWN
                  value: 0
      - name: string_value_mapper_1
        metrics:
          - name: health_status
            help: Health Status
            path: $.value2
            mapper:
              type: STRING_AS_VALUE
              mappings:
                - key: UP
                  value: 1
                - key: DOWN
                  value: 0
      - name: map_entries_mapper
        metrics:
          - name: health_status
            help: Health Status
            path: $.checks[?(@.name=="Database connections health check")].data
            type: map
            key_label: datasource
            mapper:
              type: STRING_AS_VALUE
              mappings:
                - key: UP
                  value: 1
                - key: DOWN
                  value: 0
      - name: map_entries_mapper_with_additional_label
        metrics:
          - name: health_status
            help: Health Status
            path: $.checks[?(@.name=="Database connections health check")].data
            labels:
              stage: $.stage
            type: map
            key_label: datasource
            mapper:
              type: STRING_AS_VALUE
              mappings:
                - key: UP
                  value: 1
                - key: DOWN
                  value: 0
